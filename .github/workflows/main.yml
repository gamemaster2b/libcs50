on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with Meson
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y meson ninja-build pkg-config python3
          meson setup build --prefix=/usr 2>&1 | tee build.log
          meson compile -C build 2>&1 | tee -a build.log

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: warn

  package:
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: amd64
            image: amd64/ubuntu:22.04
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            image: arm64v8/ubuntu:22.04
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU (for arm64)
        if: ${{ matrix.arch == 'arm64' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build packages
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run \
            --platform linux/${{ matrix.arch }} \
            -e DEBIAN_FRONTEND=noninteractive \
            -e DEB_ARCH=${{ matrix.deb_arch }} \
            -e RPM_ARCH=${{ matrix.rpm_arch }} \
            --rm \
            --tty \
            --volume "${PWD}/artifacts:/artifacts" \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --workdir "${GITHUB_WORKSPACE}" \
            ${{ matrix.image }} \
            /bin/bash -c \
            'set -euo pipefail; \
            apt-get update && \
            apt-get -qq install -y build-essential gem rpm ruby-full meson ninja-build pkg-config python3 && \
            gem install fpm --no-document && \
            meson setup build --prefix=/usr && \
            meson compile -C build && \
            VERSION=$(meson introspect --projectinfo build | python3 -c "import json,sys; print(json.load(sys.stdin)[\"version\"])" ) && \
            meson install -C build --destdir=/tmp/stage && \
            mkdir -p build/deb build/rpm && \
            fpm -s dir -t deb -n libcs50 -v $VERSION -a $DEB_ARCH \
              --maintainer "CS50" \
              --license "GPL-3.0" \
              --description "CS50 library for C" \
              --url "https://cs50.readthedocs.io/libraries/cs50/c/" \
              -C /tmp/stage --package build/deb . && \
            fpm -s dir -t rpm -n libcs50 -v $VERSION -a $RPM_ARCH \
              --maintainer "CS50" \
              --license "GPL-3.0" \
              --description "CS50 library for C" \
              --url "https://cs50.readthedocs.io/libraries/cs50/c/" \
              -C /tmp/stage --package build/rpm . && \
            cp build/deb/*.deb /artifacts && \
            cp build/rpm/*.rpm /artifacts && \
            echo $VERSION > /artifacts/version.txt && \
            rm -rf build /tmp/stage' 2>&1 | tee artifacts/package-${{ matrix.arch }}.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: artifacts/*
          retention-days: 1

  deploy:
    permissions:
      contents: write
    needs: package
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: artifacts
          merge-multiple: true

      - name: Setup Ruby and package_cloud
        run: sudo gem install package_cloud --no-document

      - name: Deploy
        run: |
          PACKAGECLOUD_REPO="cs50/repo"

          # Deploy deb to ubuntu repos
          UBUNTU_REPOS=( xenial yakkety zesty artful bionic cosmic disco eoan focal groovy hirsute impish jammy kinetic lunar noble )
          for repo in "${UBUNTU_REPOS[@]}"; do
            package_cloud push "$PACKAGECLOUD_REPO"/ubuntu/"$repo" artifacts/*.deb
          done

          # Deploy rpm to fedora repos
          for repo in $(seq 28 40); do
            package_cloud push "$PACKAGECLOUD_REPO"/fedora/"$repo" artifacts/*.rpm
          done
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

      - name: Read version
        id: meson_version
        run: |
          version=$(cat artifacts/version.txt)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "v${{ steps.meson_version.outputs.version }}",
              tag_commitish: "${{ github.sha }}"
            })
